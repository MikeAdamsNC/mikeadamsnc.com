<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MikeAdamsNC</title>
<meta name="description" content="MikeAdamsNC. Something new is on the way.">
<meta property="og:title" content="MikeAdamsNC">
<meta property="og:description" content="Something new is on the way.">
<meta property="og:image" content="https://mikeadamsnc.com/brand/icon/icon-512.png">
<meta name="theme-color" content="#F2F6F6">
<link rel="icon" type="image/svg+xml" href="/brand/icon/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/brand/icon/favicon-32.png">
<link rel="apple-touch-icon" href="/brand/icon/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --foam: #F2F6F6; --ink: #0B1620; --muted: #56676F; --line: #D7E2E3;
    --water: #0B6E7A; --aqua: #7FD6CF;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--foam); color: var(--ink);
    font-family: "Manrope", system-ui, sans-serif;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: clamp(24px, 6vw, 72px);
  }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 13px;
          letter-spacing: .06em; color: var(--muted); }
  main { max-width: 52rem; }
  .status { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 28px; }
  .status i { width: 22px; height: 3px; border-radius: 2px; background: var(--aqua); }
  h1 { margin: 0 0 24px; line-height: 0; }
  h1 img { width: min(100%, 680px); height: auto; }
  p.lede { margin: 0; font-size: clamp(18px, 2.4vw, 22px); line-height: 1.5; color: var(--muted);
           font-weight: 500; max-width: 34rem; }
  footer { display: flex; justify-content: space-between; border-top: 1px solid var(--line);
           padding-top: 18px; }
</style>
</head>
<body>
  <span class="mono">MikeAdamsNC.com</span>
  <main>
    <div class="status mono"><i></i>Coming soon</div>
    <h1><img src="/brand/logo/mikeadamsnc.svg" alt="MikeAdamsNC"></h1>
    <p class="lede">Something new is on the way. Check back soon.</p>
  </main>
  <footer class="mono"><span>North Carolina</span><span>&copy; {{ year }}</span></footer>
</body>
</html>
